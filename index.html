<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArchIdentify Ultimate - Field Scanner</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ArchIdentify">
    <link rel="apple-touch-icon" href="logo.png">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SPY0HDZ8XT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-SPY0HDZ8XT');
    </script>

    <style>
        :root {
            --primary: #5C4033; /* Deep soil brown */
            --secondary: #C19A6B; /* Sand/Earth */
            --accent: #2E8B57; /* GIS Green */
            --dark: #1A1A1A;
            --light: #F4F1EA;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: env(safe-area-inset-top);
        }

        header {
            background-color: var(--primary);
            color: white;
            width: 100%;
            padding: 20px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            max-width: 600px;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .team-logo {
            width: 75px; 
            height: 75px; 
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--secondary);
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .header-text h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .header-text p {
            margin: 2px 0 0 0;
            font-size: 0.9rem;
            color: var(--secondary);
            font-weight: bold;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .config-box {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--secondary);
            font-size: 0.9rem;
        }

        .config-box input {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
        }

        .camera-box {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            border: 3px solid var(--primary);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(46, 139, 87, 0.8);
            box-shadow: 0 0 10px rgba(46, 139, 87, 1);
            animation: scan 2s linear infinite;
            display: none;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        canvas { display: none; }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-full {
            grid-column: span 2;
        }

        button {
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-secondary { background-color: var(--secondary); color: var(--dark); }
        .btn-gis { background-color: var(--accent); color: white; display: none; }
        .btn-danger { background-color: #a33; color: white; padding: 8px; font-size: 0.85rem; margin-top: 10px;}

        button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 3px rgba(0,0,0,0.1); }

        .dashboard {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--secondary);
            min-height: 100px;
            font-size: 0.95rem;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .dashboard h3 { margin-top: 0; color: var(--primary); border-bottom: 2px solid var(--secondary); padding-bottom: 5px; }
        
        .gis-ledger-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .gis-ledger-box h3 { margin-top: 0; color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 5px; }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        th { background-color: #f2f2f2; color: var(--dark); }

        .loading {
            color: var(--primary);
            font-weight: bold;
            text-align: center;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .tag {
            display: inline-block;
            background: var(--secondary);
            color: var(--dark);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="DigiBlitz" class="team-logo" id="logoImage">
            <div class="header-text">
                <h1>ArchIdentify</h1>
                <p>The Archaeologist's Assistant in a Box</p>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="config-box">
            <label for="apiKey"><strong>System Access Key:</strong></label>
            <input type="password" id="apiKey" placeholder="Paste your secret Google AI Studio API key here..." value="" />
        </div>

        <div class="camera-box">
            <video id="webcam" autoplay playsinline></video>
            <div class="scanner-line" id="scanner"></div>
        </div>

        <div class="controls">
            <button class="btn-secondary" id="switchCamBtn">🔄 Switch Camera</button>
            <button class="btn-primary" id="captureBtn">🔍 Analyze Artifact</button>
            <button class="btn-gis btn-full" id="gisBtn">🌐 Sync to GIS Database</button>
        </div>

        <canvas id="captureCanvas"></canvas>

        <div class="dashboard">
            <h3>ArchIdentify Telemetry</h3>
            <div id="analysis-result">System ready. Place item inside the chamber and click Analyze.</div>
        </div>

        <div class="gis-ledger-box">
            <h3>🌐 Global GIS Relational Database</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button class="btn-primary" id="downloadGisBtn" style="padding: 8px 12px; font-size: 0.85rem;">📥 Export GIS Data (CSV)</button>
                <button class="btn-danger" id="clearGisBtn" style="margin: 0; padding: 8px 12px;">🗑️ Clear DB</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Classification</th>
                            <th>Latitude</th>
                            <th>Longitude</th>
                            <th>Source</th>
                        </tr>
                    </thead>
                    <tbody id="gisTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('captureCanvas');
        const captureBtn = document.getElementById('captureBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const gisBtn = document.getElementById('gisBtn');
        const downloadGisBtn = document.getElementById('downloadGisBtn');
        const clearGisBtn = document.getElementById('clearGisBtn');
        const resultDiv = document.getElementById('analysis-result');
        const apiKeyInput = document.getElementById('apiKey');
        const scanner = document.getElementById('scanner');
        const gisTableBody = document.getElementById('gisTableBody');
        const logoImage = document.getElementById('logoImage');

        let currentStream = null;
        let useFacingMode = "environment"; 
        let lastAnalysisData = null; 
        let isAnalyzing = false;

        // Graceful error text if logo.png isn't found
        logoImage.onerror = function() {
            console.log("logo.png not detected yet. Ensure your team logo is uploaded and named exactly logo.png");
            this.style.display = "none";
        };

        // Initialize Camera
        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            const constraints = {
                video: { facingMode: useFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
                audio: false
            };
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                resultDiv.innerHTML = "<strong style='color:red;'>Camera Error:</strong> Cannot access device camera. Please check browser permissions.";
            }
        }

        switchCamBtn.addEventListener('click', () => {
            if(isAnalyzing) return;
            useFacingMode = useFacingMode === "environment" ? "user" : "environment";
            initCamera();
        });

        function getFrameBase64() {
            if (video.videoWidth === 0 || video.videoHeight === 0) {
                return null;
            }
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        }

        // Run Analysis Matrix
        async function analyzeArtifact() {
            if (isAnalyzing) return; 
            
            if (!navigator.onLine) {
                alert("You are offline! Please connect to Wi-Fi to use the ArchIdentify AI Core.");
                return;
            }

            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert("Please input your secret AI Studio API key.");
                return;
            }

            const base64Image = getFrameBase64();
            if (!base64Image) {
                alert("Camera is still warming up. Please wait 1 second and try again.");
                return;
            }

            isAnalyzing = true;
            captureBtn.disabled = true;
            scanner.style.display = "block";
            gisBtn.style.display = "none";
            resultDiv.innerHTML = '<div class="loading">Parsing telemetry profile... Cross-referencing archaeological catalog...</div>';

            const systemInstruction = `
You are ArchIdentify, an advanced AI field research assistant. 
Analyze the item in the image (cultural artifact, map, or organic specimen like a seashell).
Provide a concise but technically detailed report. Output your findings exactly in this 3-part format:

Classification & Origin: [Identify the exact item, cultural group/species, and estimated age in 1-2 punchy sentences].
Physical Properties & Features: [Detail material matrix, air/moisture vulnerabilities, and surface attributes].
Preservation & Next Step: [Specify instant field care rules, like climate-controlled sleeve needs, and name the specialist research lab required next].
`;

            const payload = {
                contents: [{
                    parts: [
                        { text: systemInstruction },
                        { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                    ]
                }]
            };

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || "Invalid API Key or Server Error");
                }
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let rawText = data.candidates[0].content.parts[0].text;
                    
                    let formattedText = rawText
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') 
                        .replace(/\n/g, '<br>');
                    
                    resultDiv.innerHTML = `
                        <div style="margin-bottom: 10px;">
                            <span class="tag">Telemetry Confirmed</span>
                        </div>
                        ${formattedText}
                    `;
                    
                    lastAnalysisData = rawText; 
                    gisBtn.style.display = "block";
                } else {
                    resultDiv.innerText = "Error: Processing core could not isolate item boundary markers.";
                }
            } catch (error) {
                resultDiv.innerHTML = `<strong style='color:#a33;'>System Error:</strong> ${error.message}`;
            } finally {
                isAnalyzing = false;
                captureBtn.disabled = false;
                scanner.style.display = "none";
            }
        }

        // GPS Fallback Engine
        function getFieldCoordinates() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => resolve({ lat: pos.coords.latitude.toFixed(5), lng: pos.coords.longitude.toFixed(5), type: "Device GPS" }),
                        () => resolve({ lat: (36.1482 + (Math.random() - 0.5) * 0.005).toFixed(5), lng: (-115.1512 + (Math.random() - 0.5) * 0.005).toFixed(5), type: "Site Sector Grid-Alpha" }),
                        { timeout: 3000 }
                    );
                } else {
                    resolve({ lat: "36.14820", lng: "-115.15120", type: "Default Grid-Base" });
                }
            });
        }

        // Markdown-proof Classification Scraper
        function parseClassification(rawText) {
            try {
                let cleanText = rawText.replace(/\*/g, "").replace(/<\/?[^>]+(>|$)/g, "");
                
                const match = cleanText.match(/Classification & Origin:\s*([^\n\.]+)/i) || cleanText.match(/Classification[^:]*:\s*([^\n\.]+)/i);
                if (match && match[1]) return match[1].trim();
                
                const lines = cleanText.split('\n');
                for (let line of lines) {
                    if (line.toLowerCase().includes('classification')) {
                        return line.replace(/Classification & Origin:/i, "").split('.')[0].trim();
                    }
                }
                return "Identified Specimen";
            } catch (e) {
                return "Identified Artifact";
            }
        }

        // DB Sync
        async function syncToGisDatabase() {
            if (!lastAnalysisData) return;

            gisBtn.style.display = "none";
            const originalHTML = resultDiv.innerHTML;
            resultDiv.innerHTML = '<div class="loading">Pinging telemetry arrays... Syncing to secure server...</div>';

            const coords = await getFieldCoordinates();
            const classification = parseClassification(lastAnalysisData);
            const timestamp = new Date().toLocaleString();

            const newRecord = { timestamp, classification, latitude: coords.lat, longitude: coords.lng, source: coords.type };

            let currentDb = JSON.parse(localStorage.getItem('archIdentifyDb')) || [];
            currentDb.unshift(newRecord); 
            localStorage.setItem('archIdentifyDb', JSON.stringify(currentDb));

            renderGisTable();

            resultDiv.innerHTML = `
                <div style="color: #2E8B57; font-weight: bold; margin-bottom: 10px;">• TELEMETRY SYNCED SUCCESSFULLY TO LOCAL DATABASE PLATFORM!</div>
            ` + originalHTML;
        }

        // Render Table
        function renderGisTable() {
            let currentDb = JSON.parse(localStorage.getItem('archIdentifyDb')) || [];
            gisTableBody.innerHTML = '';

            if (currentDb.length === 0) {
                gisTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#999;">No database tracking items synced yet.</td></tr>';
                return;
            }

            currentDb.forEach(record => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${record.timestamp}</td>
                    <td><strong>${record.classification}</strong></td>
                    <td>${record.latitude}</td>
                    <td>${record.longitude}</td>
                    <td><span style="background:#e8f5e9; color:#2e7d32; padding:2px 6px; border-radius:4px; font-size:0.75rem;">${record.source}</span></td>
                `;
                gisTableBody.appendChild(row);
            });
        }

        // CSV Downloader
        downloadGisBtn.addEventListener('click', () => {
            let currentDb = JSON.parse(localStorage.getItem('archIdentifyDb')) || [];
            if (currentDb.length === 0) return alert("Database ledger empty. Scan and sync items first!");

            let csvContent = "data:text/csv;charset=utf-8,Timestamp,Classification,Latitude,Longitude,LocationSource\n";
            currentDb.forEach(r => {
                let cleanClass = r.classification.replace(/"/g, '""');
                csvContent += `"${r.timestamp}","${cleanClass}",${r.latitude},${r.longitude},"${r.source}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "ArchIdentify_GIS_Sync_Log.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        clearGisBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to completely clear out the local GIS relational database?")) {
                localStorage.removeItem('archIdentifyDb');
                renderGisTable();
            }
        });

        captureBtn.addEventListener('click', analyzeArtifact);
        gisBtn.addEventListener('click', syncToGisDatabase);
        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
            renderGisTable(); 
        });
    </script>
</body>
</html>
